<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Division – Mitosis | Class IX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030d07;
  --surface: #071a0e;
  --border: #1a3d22;
  --green: #00e87a;
  --green-dim: #00a355;
  --text: #d4f0de;
  --text-dim: #6b9e7a;
  --accent: #b8ff6e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 32px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:rgba(3,13,7,0.98);
  z-index:10;
}
.h-title { font-family:'DM Serif Display',serif; font-size:1.1rem; color:var(--green); }
.h-sub { font-size:0.68rem; color:var(--text-dim); font-family:'DM Mono',monospace; margin-top:2px; }
.pills { display:flex; gap:5px; }
.pill {
  font-size:0.63rem; font-family:'DM Mono',monospace;
  padding:4px 10px; border-radius:20px;
  border:1px solid var(--border); color:var(--text-dim);
  cursor:pointer; transition:all 0.25s; white-space:nowrap;
}
.pill.active { background:var(--green); color:#000; border-color:var(--green); font-weight:700; }
.pill.done { border-color:var(--green-dim); color:var(--green-dim); }

/* MAIN */
main {
  flex:1; display:grid; grid-template-columns:1fr 1fr;
  overflow:hidden; min-height:0;
}

/* LEFT */
.info {
  padding:32px 38px;
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:center;
  overflow:hidden;
  transition:opacity 0.25s, transform 0.25s;
}
.info.fade { opacity:0; transform:translateY(10px); }
.s-num { font-family:'DM Mono',monospace; font-size:0.65rem; color:var(--text-dim); letter-spacing:0.15em; margin-bottom:6px; }
.s-name { font-family:'DM Serif Display',serif; font-size:3rem; line-height:1.05; margin-bottom:4px; }
.s-tag { font-family:'DM Serif Display',serif; font-style:italic; font-size:0.82rem; color:var(--text-dim); margin-bottom:20px; }
.s-desc { font-size:0.88rem; line-height:1.72; margin-bottom:22px; max-width:400px; }
.kps { display:flex; flex-direction:column; gap:9px; }
.kp { display:flex; align-items:flex-start; gap:9px; font-size:0.8rem; color:#a8d4b5; line-height:1.5;
  opacity:0; transform:translateX(-10px); transition:opacity 0.35s, transform 0.35s; }
.kp.show { opacity:1; transform:none; }
.kp-dot { width:6px; height:6px; border-radius:50%; background:var(--green); margin-top:6px; flex-shrink:0; }
.kp strong { color:var(--accent); }

/* RIGHT */
.anim {
  display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  transition:background 0.7s;
}
.anim svg { width:320px; height:320px; }

/* FOOTER */
footer {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 32px;
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.pbar { flex:1; height:3px; background:var(--border); border-radius:2px; margin:0 20px; overflow:hidden; }
.pfill { height:100%; border-radius:2px; transition:width 0.5s cubic-bezier(0.4,0,0.2,1); background:linear-gradient(90deg,var(--green),var(--accent)); }
.nbtn {
  font-family:'DM Mono',monospace; font-size:0.72rem;
  padding:8px 20px; border-radius:6px;
  border:1px solid var(--border); background:transparent;
  color:var(--text-dim); cursor:pointer; transition:all 0.2s;
}
.nbtn:hover { border-color:var(--green); color:var(--green); }
.nbtn.pri { background:var(--green); color:#000; border-color:var(--green); font-weight:700; }
.nbtn.pri:hover { background:var(--accent); border-color:var(--accent); }
.pinfo { font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--text-dim); }
.keyhint { font-family:'DM Mono',monospace; font-size:0.63rem; color:var(--text-dim); opacity:0.5; }

/* ── CELL ANIMATIONS ── */
@keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
@keyframes shimmer { 0%,100%{opacity:0.45} 50%{opacity:0.9} }
@keyframes goUp { from{transform:translateY(0)} to{transform:translateY(-55px)} }
@keyframes goDown { from{transform:translateY(0)} to{transform:translateY(55px)} }
@keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes rotateSlow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes spindleGrow { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
@keyframes condenseIn { from{transform:scale(1.8) rotate(-15deg);opacity:0} to{transform:scale(1) rotate(0deg);opacity:1} }
@keyframes cellWobble { 0%{rx:138;ry:138} 50%{rx:145;ry:132} 100%{rx:138;ry:138} }
@keyframes nucleusGlow { 0%,100%{opacity:0.6} 50%{opacity:1} }
@keyframes pinch {
  0%   { d: path("M 10,160 Q 160,158 310,160"); }
  100% { d: path("M 10,160 Q 160,140 310,160"); }
}
.dna-anim { animation: shimmer 2.2s ease-in-out infinite; }
.chr-up   { animation: goUp 1.2s cubic-bezier(0.4,0,0.2,1) both; }
.chr-dn   { animation: goDown 1.2s cubic-bezier(0.4,0,0.2,1) both; }
.pop      { animation: popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both; }
.fadein   { animation: fadeIn 0.6s ease both; }
.condense { animation: condenseIn 0.75s cubic-bezier(0.34,1.2,0.64,1) both; }
.spindle-draw { stroke-dasharray:300; animation: spindleGrow 0.9s ease-out both; }
</style>
</head>
<body>

<header>
  <div>
    <div class="h-title">Cell Division · Mitosis</div>
    <div class="h-sub">Yajas Mishra</div>
    <div class="h-sub">Class IX - Excellent</div>
    <div class="h-sub">The Fundamental Unit of Life (Biology)</div>
  </div>
  <div class="pills" id="pills">
    <div class="pill" onclick="goTo(0)">Interphase</div>
    <div class="pill" onclick="goTo(1)">Prophase</div>
    <div class="pill" onclick="goTo(2)">Metaphase</div>
    <div class="pill" onclick="goTo(3)">Anaphase</div>
    <div class="pill" onclick="goTo(4)">Telophase</div>
    <div class="pill" onclick="goTo(5)">Cytokinesis</div>
  </div>
</header>

<main>
  <div class="info" id="info">
    <div class="s-num" id="snum"></div>
    <div class="s-name" id="sname"></div>
    <div class="s-tag"  id="stag"></div>
    <div class="s-desc" id="sdesc"></div>
    <div class="kps"    id="kps"></div>
  </div>
  <div class="anim" id="anim">
    <!-- SVG injected here -->
  </div>
</main>

<footer>
  <div class="keyhint">← → arrow keys</div>
  <div class="pbar"><div class="pfill" id="pfill"></div></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="pinfo" id="pinfo"></span>
    <button class="nbtn" id="bprev" onclick="prev()">← Prev</button>
    <button class="nbtn pri" id="bnext" onclick="next()">Next →</button>
  </div>
</footer>

<script>
/* ─────────────────────────────────────────────────────────────
   SVG templates — each stage is a complete, self-contained SVG
───────────────────────────────────────────────────────────── */

function svgInterphase(c) {
  return `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cg0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${c}" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0.02"/>

  </defs>
  <!-- Cell body -->
  <ellipse cx="160" cy="160" rx="138" ry="138" fill="url(#cg0)" stroke="${c}" stroke-width="2.5"/>
  <!-- Nuclear membrane -->
  <ellipse cx="160" cy="160" rx="80" ry="76" fill="${c}18" stroke="${c}88" stroke-width="1.8" class="dna-anim"/>

  <text x="190" y="148" font-family="DM Mono,monospace" font-size="10" fill="${c}99">Chromatin</text>

function svgProphase(c) {

function svgTelophase(c) {
  return `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cg4t" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${c}" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0.02"/>
    </radialGradient>

}

const stages = [

      "DNA replication occurs — every chromosome is duplicated (<strong>S phase</strong>)",

let cur = 0;

function goTo(n) {
  cur = n;
  const st = stages[n];

  // Pills
  document.querySelectorAll('.pill').forEach((p,i) => {
    p.className = 'pill';
    if (i < n) p.classList.add('done');
    if (i === n) {
      p.classList.add('active');
      p.style.background = st.color;
      p.style.borderColor = st.color;
      p.style.color = '#000';
    } else {
      p.style.background = '';
      p.style.borderColor = '';
      p.style.color = '';
    }
  });

  // Info panel fade
  const info = document.getElementById('info');
  info.classList.add('fade');

  setTimeout(() => {
    document.getElementById('snum').textContent = `STAGE 0${n+1} / 06`;
    const sname = document.getElementById('sname');
    sname.textContent = st.name;
    sname.style.color = st.color;
    document.getElementById('stag').textContent = st.tag;
    document.getElementById('sdesc').innerHTML = st.desc;

    const kps = document.getElementById('kps');
    kps.innerHTML = '';
    st.points.forEach((pt, i) => {
      const d = document.createElement('div');
      d.className = 'kp';
      d.innerHTML = `<div class="kp-dot" style="background:${st.color}"></div><span>${pt}</span>`;
      kps.appendChild(d);
      setTimeout(() => d.classList.add('show'), 60 + i * 80);
    });

    info.classList.remove('fade');
  }, 220);

  // SVG — completely replace
  const animDiv = document.getElementById('anim');
  animDiv.style.background = st.bg;
  // Force reflow by replacing innerHTML
  animDiv.innerHTML = st.svgFn(st.color);

  // Progress
  document.getElementById('pfill').style.width = ((n+1)/6*100)+'%';
  document.getElementById('pinfo').textContent = `${n+1} / 6`;

  // Buttons
  document.getElementById('bprev').style.opacity = n === 0 ? '0.35' : '1';
  const bn = document.getElementById('bnext');
  if (n === 5) { bn.textContent = '↺ Restart'; bn.onclick = () => goTo(0); }
  else { bn.textContent = 'Next →'; bn.onclick = next; }
}

function next() { if (cur < 5) goTo(cur+1); }
function prev() { if (cur > 0) goTo(cur-1); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); next(); }
  if (e.key==='ArrowLeft') { e.preventDefault(); prev(); }
});

goTo(0);
</script>
